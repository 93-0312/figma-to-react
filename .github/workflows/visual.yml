name: Visual regression

# 플레이그라운드 컴포넌트 스냅샷 비교. 헤드리스 추출이 "컴파일은 되지만 시각적으로 틀린"
# 변경을 만들 수 있어 빌드 검증을 보완한다.
#
# ⚠️ baseline 은 OS 별로 다름. CI(Linux) 첫 사용 전:
#   Actions → "Visual regression" → Run workflow → update_baselines=true 로 Linux baseline 생성(→ PR).
#   그 PR 머지 후부터 PR 마다 자동 비교됨.

on:
  pull_request:
    paths: ["src/**", "tailwind.config.js", "index.html"]
  workflow_dispatch:
    inputs:
      update_baselines:
        description: "Linux baseline 새로 생성(스냅샷 갱신 → PR)"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
    steps:
      - uses: actions/checkout@v4
      - run: npm ci

      - name: 시각 비교 (PR)
        if: ${{ github.event.inputs.update_baselines != 'true' }}
        run: npm run test:visual

      - name: baseline 갱신 (수동)
        if: ${{ github.event.inputs.update_baselines == 'true' }}
        run: npm run test:visual:update

      - name: diff 리포트 업로드 (실패 시)
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: figma-to-react/playwright-report/
          retention-days: 7

      - name: Linux baseline PR 생성 (수동 갱신 시)
        if: ${{ github.event.inputs.update_baselines == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BR="visual-baselines-${{ github.run_id }}"
          git checkout -b "$BR"
          git add tests
          if git diff --cached --quiet; then
            echo "baseline 변경 없음"
          else
            git commit -m "test(visual): Linux baseline 갱신"
            git push -u origin "$BR"
            gh pr create --base main --head "$BR" --title "test(visual): Linux baseline" \
              --body "CI(Linux)에서 생성한 시각 회귀 baseline. 머지하면 이후 PR 부터 자동 비교됩니다." || true
          fi
