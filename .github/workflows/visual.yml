name: Visual regression

# 플레이그라운드 컴포넌트 스냅샷 비교(gate) + PR 시각 증거 코멘트(Figma 원본 + Before/After/Diff).
#
# ⚠️ baseline 은 OS 별로 다름. CI(Linux) 첫 사용 전:
#   Actions → "Visual regression" → Run workflow → update_baselines=true 로 Linux baseline 생성(→ PR).
#   그 PR 머지 후부터 PR 마다 자동 비교 + 증거 코멘트가 동작한다.

on:
  pull_request:
    paths: ["src/**", "tailwind.config.js", "index.html"]
  workflow_dispatch:
    inputs:
      update_baselines:
        description: "Linux baseline 새로 생성(→ PR)"
        type: boolean
        default: false
      pr:
        description: "이 PR 번호의 브랜치를 검사 + 증거 코멘트(자동화 PR 용)"
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # 자동화(GITHUB_TOKEN) PR 은 pull_request 이벤트로 못 잡으므로 figma-sync 가
      # `gh workflow run -f pr=<N>` 으로 호출 → 여기서 그 PR 브랜치로 체크아웃해 검사한다.
      - name: PR 브랜치 체크아웃 (dispatch 호출 시)
        if: ${{ github.event.inputs.pr != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr checkout "${{ github.event.inputs.pr }}"

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: 시각 비교 (gate)
        if: ${{ github.event.inputs.update_baselines != 'true' }}
        run: npm run test:visual

      - name: baseline 갱신 (수동)
        if: ${{ github.event.inputs.update_baselines == 'true' }}
        run: npm run test:visual:update

      # ── PR 시각 증거: Figma 원본 + Before/After/Diff 를 evidence 브랜치에 올리고 PR 에 코멘트 ──
      - name: PR 시각 증거 + 코멘트
        if: ${{ always() && (github.event_name == 'pull_request' || github.event.inputs.pr != '') }}
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number || github.event.inputs.pr }}
        run: |
          node scripts/pr-evidence.mjs || true
          if [ ! -s evidence/comment.md ]; then echo "시각 변경 없음 → 코멘트 생략"; exit 0; fi
          cp -r evidence /tmp/ev
          BR="evidence-pr-${PR}"
          # 메인 작업트리 보호 위해 임시 clone 에서 orphan 브랜치 구성(이미지만 담음 → 히스토리 비대화 방지)
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/repo
          cd /tmp/repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan "$BR"
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p e
          for d in /tmp/ev/*/; do [ -d "$d" ] && cp -r "$d" e/; done
          git add e
          git commit -m "visual evidence for PR #${PR}"
          git push -f origin "$BR"
          cd "$GITHUB_WORKSPACE"
          BASE="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${BR}/e"
          sed "s#__BASE__#${BASE}#g" /tmp/ev/comment.md > /tmp/comment.md
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md --edit-last 2>/dev/null \
            || gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md

      # ── sync PR 한정: 증거를 남긴 뒤 새 렌더로 Linux baseline 을 자동 갱신해 PR 브랜치에 커밋 ──
      # 머지 시 코드+baseline 이 원자적으로 반영 → 수동 dispatch 불필요.
      # baseline 을 "무조건" 갱신하면 gate 가 무의미해지므로, 신뢰된 자동 동기화(figma-sync/*)에만 적용한다.
      # (사람 PR 은 회귀를 자동 수락하면 안 되므로 제외 — 그쪽은 gate red 로 남겨 작성자가 직접 판단.)
      - name: sync PR baseline 자동 갱신
        if: ${{ always() && github.event.inputs.pr != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BR=$(gh pr view "${{ github.event.inputs.pr }}" --repo "$GITHUB_REPOSITORY" --json headRefName -q .headRefName)
          case "$BR" in
            figma-sync/*) ;;
            *) echo "비-sync PR($BR) → baseline 자동 갱신 생략"; exit 0;;
          esac
          npx playwright test --update-snapshots || true
          if git diff --quiet -- tests; then echo "baseline 변화 없음 → 커밋 생략"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tests
          git commit -m "test(visual): sync 렌더에 맞춰 Linux baseline 자동 갱신"
          git push origin "HEAD:${BR}"
          echo "baseline 자동 갱신 커밋 → ${BR}"

      - name: diff 리포트 업로드 (실패 시)
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Linux baseline PR (수동 갱신 시)
        if: ${{ github.event.inputs.update_baselines == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BR="visual-baselines-${{ github.run_id }}"
          git checkout -b "$BR"
          git add tests
          if git diff --cached --quiet; then
            echo "baseline 변경 없음"
          else
            git commit -m "test(visual): Linux baseline 갱신"
            git push -u origin "$BR"
            gh pr create --base main --head "$BR" --title "test(visual): Linux baseline" \
              --body "CI(Linux) 시각 회귀 baseline. 머지하면 이후 PR 부터 자동 비교 + 증거 코멘트가 동작합니다." || true
          fi
