name: Visual regression

# 플레이그라운드 컴포넌트 스냅샷 비교(gate) + PR 시각 증거 코멘트(Figma 원본 + Before/After/Diff).
#
# ⚠️ baseline 은 OS 별로 다름. CI(Linux) 첫 사용 전:
#   Actions → "Visual regression" → Run workflow → update_baselines=true 로 Linux baseline 생성(→ PR).
#   그 PR 머지 후부터 PR 마다 자동 비교 + 증거 코멘트가 동작한다.

on:
  pull_request:
    paths: ["src/**", "tailwind.config.js", "index.html"]
  workflow_dispatch:
    inputs:
      update_baselines:
        description: "Linux baseline 새로 생성(→ PR)"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: 시각 비교 (gate)
        if: ${{ github.event.inputs.update_baselines != 'true' }}
        run: npm run test:visual

      - name: baseline 갱신 (수동)
        if: ${{ github.event.inputs.update_baselines == 'true' }}
        run: npm run test:visual:update

      # ── PR 시각 증거: Figma 원본 + Before/After/Diff 를 evidence 브랜치에 올리고 PR 에 코멘트 ──
      - name: PR 시각 증거 + 코멘트
        if: ${{ always() && github.event_name == 'pull_request' }}
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          node scripts/pr-evidence.mjs || true
          if [ ! -s evidence/comment.md ]; then echo "시각 변경 없음 → 코멘트 생략"; exit 0; fi
          cp -r evidence /tmp/ev
          BR="evidence-pr-${PR}"
          # 메인 작업트리 보호 위해 임시 clone 에서 orphan 브랜치 구성(이미지만 담음 → 히스토리 비대화 방지)
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/repo
          cd /tmp/repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan "$BR"
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p e
          for d in /tmp/ev/*/; do [ -d "$d" ] && cp -r "$d" e/; done
          git add e
          git commit -m "visual evidence for PR #${PR}"
          git push -f origin "$BR"
          cd "$GITHUB_WORKSPACE"
          BASE="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${BR}/e"
          sed "s#__BASE__#${BASE}#g" /tmp/ev/comment.md > /tmp/comment.md
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md --edit-last 2>/dev/null \
            || gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md

      - name: diff 리포트 업로드 (실패 시)
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Linux baseline PR (수동 갱신 시)
        if: ${{ github.event.inputs.update_baselines == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BR="visual-baselines-${{ github.run_id }}"
          git checkout -b "$BR"
          git add tests
          if git diff --cached --quiet; then
            echo "baseline 변경 없음"
          else
            git commit -m "test(visual): Linux baseline 갱신"
            git push -u origin "$BR"
            gh pr create --base main --head "$BR" --title "test(visual): Linux baseline" \
              --body "CI(Linux) 시각 회귀 baseline. 머지하면 이후 PR 부터 자동 비교 + 증거 코멘트가 동작합니다." || true
          fi
