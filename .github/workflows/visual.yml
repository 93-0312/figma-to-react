name: Visual regression

# 플레이그라운드 컴포넌트 스냅샷 비교(gate) + PR 시각 증거 코멘트(Figma 원본 + Before/After/Diff).
#
# ⚠️ baseline 은 OS 별로 다름. CI(Linux) 첫 사용 전:
#   Actions → "Visual regression" → Run workflow → update_baselines=true 로 Linux baseline 생성(→ PR).
#   그 PR 머지 후부터 PR 마다 자동 비교 + 증거 코멘트가 동작한다.

on:
  pull_request:
    paths: ["src/**", "tailwind.config.js", "index.html"]
  workflow_dispatch:
    inputs:
      update_baselines:
        description: "Linux baseline 새로 생성(→ PR)"
        type: boolean
        default: false
      pr:
        description: "이 PR 번호의 브랜치를 검사 + 증거 코멘트(자동화 PR 용)"
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: write

concurrency:
  # dispatch 는 ref 가 항상 main 이라 ref 만으로 그룹핑하면 sync PR 2개 이상을 순차
  # dispatch 할 때 뒤 실행이 앞 실행을 취소해 버린다 → PR 번호로 그룹을 분리.
  group: visual-${{ github.event.inputs.pr || github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    # 봇(github-actions)이 GITHUB_TOKEN 으로 연 자동 sync PR 은 pull_request 이벤트를 발생시키지
    # 않고 figma-sync 워크플로가 dispatch(-f pr=N)로 검사한다. 그 외 사람이 연 모든 PR(브랜치명
    # 무관 — figma-sync/* 수동 PR 포함)은 pull_request 로 visual 게이트 + 증거 코멘트를 실행한다.
    # (만약 봇 PR 이 pull_request 를 발생시키더라도 작성자 검사로 dispatch 와 중복 실행되지 않게 건너뛴다.)
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.user.login != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # 자동화(GITHUB_TOKEN) PR 은 pull_request 이벤트로 못 잡으므로 figma-sync 가
      # `gh workflow run -f pr=<N>` 으로 호출 → 여기서 그 PR 브랜치로 체크아웃해 검사한다.
      - name: PR 브랜치 체크아웃 (dispatch 호출 시)
        if: ${{ github.event.inputs.pr != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr checkout "${{ github.event.inputs.pr }}"

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: 시각 비교 (gate)
        if: ${{ github.event.inputs.update_baselines != 'true' }}
        run: npm run test:visual

      - name: baseline 갱신 (수동)
        if: ${{ github.event.inputs.update_baselines == 'true' }}
        run: npm run test:visual:update

      # ── PR 시각 증거: Figma 원본 + Before/After/Diff 를 evidence 브랜치에 올리고 PR 에 코멘트 ──
      - name: PR 시각 증거 + 코멘트
        if: ${{ always() && (github.event_name == 'pull_request' || github.event.inputs.pr != '') }}
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number || github.event.inputs.pr }}
        run: |
          node scripts/pr-evidence.mjs || true
          if [ ! -s evidence/comment.md ]; then echo "시각 변경 없음 → 코멘트 생략"; exit 0; fi
          cp -r evidence /tmp/ev
          BR="evidence-pr-${PR}"
          # 메인 작업트리 보호 위해 임시 clone 에서 orphan 브랜치 구성(이미지만 담음 → 히스토리 비대화 방지)
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/repo
          cd /tmp/repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan "$BR"
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p e
          for d in /tmp/ev/*/; do [ -d "$d" ] && cp -r "$d" e/; done
          git add e
          git commit -m "visual evidence for PR #${PR}"
          git push -f origin "$BR"
          cd "$GITHUB_WORKSPACE"
          BASE="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${BR}/e"
          sed "s#__BASE__#${BASE}#g" /tmp/ev/comment.md > /tmp/comment.md
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md --edit-last 2>/dev/null \
            || gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md

      # ── sync PR 한정: 증거를 남긴 뒤 새 렌더로 Linux baseline 을 자동 갱신해 PR 브랜치에 커밋 ──
      # 머지 시 코드+baseline 이 원자적으로 반영 → 수동 dispatch 불필요.
      # baseline 을 "무조건" 갱신하면 gate 가 무의미해지므로, 신뢰된 자동 동기화(figma-sync/*)에만 적용한다.
      # (사람 PR 은 회귀를 자동 수락하면 안 되므로 제외 — 그쪽은 gate red 로 남겨 작성자가 직접 판단.)
      - name: sync PR baseline + 노드 지문 자동 갱신
        if: ${{ always() && github.event.inputs.pr != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
        run: |
          BR=$(gh pr view "${{ github.event.inputs.pr }}" --repo "$GITHUB_REPOSITORY" --json headRefName -q .headRefName)
          case "$BR" in
            figma-sync/*) ;;
            *) echo "비-sync PR($BR) → 자동 갱신 생략"; exit 0;;
          esac
          npx playwright test --update-snapshots || true
          # 노드 지문 갱신(poll 의 2차 게이트 기준점) — ⚠️ 라이브 상태가 아니라 sync 가 추출한
          # 시점의 버전(manifest lastSyncedVersion)으로 고정해 기록한다. 라이브로 기록하면
          # 추출~여기 사이의 디자이너 편집이 "동기화됨"으로 오기록돼 영구 유실된다.
          # (버전 조회 실패 시 지문 미갱신 → 다음 폴링이 재감지: 안전 방향 폴백)
          VER=$(node -p "JSON.parse(require('fs').readFileSync('figma.manifest.json','utf8')).lastSyncedVersion" 2>/dev/null || echo "")
          # 에이전트가 manifest 워터마크 전진을 누락하는 경우가 있다(실제 사례 PR #153 —
          # 그대로 두면 지문이 구버전 상태로 기록되고 poll 이 영구 재감지→dedup 교착).
          # 브랜치의 값이 main 과 동일하면 누락으로 판단해 라이브 버전으로 결정적 보정.
          MAIN_VER=$(git show origin/main:figma.manifest.json 2>/dev/null | grep -oE '"lastSyncedVersion": *"[0-9]+"' | grep -oE '[0-9]+' | head -1 || echo "")
          if [ -n "$VER" ] && [ "$VER" = "$MAIN_VER" ]; then
            set +e; OUT=$(node scripts/check-figma-version.mjs 2>&1); set -e
            LIVE=$(printf '%s' "$OUT" | grep -oE '"currentVersion": *"[0-9]+"' | grep -oE '[0-9]+' | head -1)
            if [ -n "$LIVE" ] && [ "$LIVE" != "$VER" ]; then
              echo "::warning::에이전트가 워터마크 전진 누락 → $LIVE 로 보정"
              node scripts/check-figma-version.mjs --record "$LIVE"
              VER="$LIVE"
            fi
          fi
          node scripts/check-figma-nodes.mjs --record ${VER:+--version "$VER"} || true
          # untracked 새 baseline(신규 컴포넌트 스냅샷)은 diff 에 안 잡히므로 add 후 --cached 로 검사
          git add tests figma.fingerprints.json figma.manifest.json
          if git diff --cached --quiet; then echo "baseline/지문 변화 없음 → 커밋 생략"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "test(visual): sync 렌더에 맞춰 Linux baseline + 노드 지문 자동 갱신"
          git push origin "HEAD:${BR}"
          echo "baseline + 지문 자동 갱신 커밋 → ${BR}"

      # ── sync PR 한정: 재검증 green 이면 자동 머지 (마지막 마일 자동화) ──
      # 종전엔 "재검증→머지"가 세션 있는 사람/Claude 손에 남아 있어, 세션이 없으면 PR 이
      # 방치됐다(실제 사례 #150 — 15일 방치 + 연결 이슈가 열린 채라 poll dedup 이 후속
      # sync 까지 전부 차단). 증거 코멘트 + baseline·지문 정합이 끝난 상태에서 갱신된
      # baseline 으로 전체 시각 테스트가 green 일 때만 머지한다. red 면 종전처럼 PR 을
      # 열어두고 사람이 판단한다. (사람 PR 은 위 단계와 동일하게 대상 아님)
      - name: sync PR 자동 머지 (재검증 green 시)
        if: ${{ always() && github.event.inputs.pr != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BR=$(gh pr view "${{ github.event.inputs.pr }}" --repo "$GITHUB_REPOSITORY" --json headRefName -q .headRefName 2>/dev/null || echo "")
          case "$BR" in
            figma-sync/*) ;;
            *) echo "비-sync PR($BR) → 자동 머지 생략"; exit 0;;
          esac
          # 갱신된 baseline 기준 재검증 — 렌더 플레이크/미커버 diff 가 있으면 머지하지 않는다
          if ! npx playwright test; then
            echo "::warning::재검증 red → 자동 머지 생략 (PR #${{ github.event.inputs.pr }} 열어둠, 사람 판단 필요)"
            exit 0
          fi
          if gh pr merge "${{ github.event.inputs.pr }}" --repo "$GITHUB_REPOSITORY" --squash --delete-branch; then
            echo "✅ 자동 머지 완료: PR #${{ github.event.inputs.pr }}"
            # Closes 키워드가 처리되지 않는 경우가 있어(실제 사례 #151) 명시적으로도 닫는다
            ISSUE=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'in:title Figma 변경 감지' --json number --jq '.[0].number // empty' 2>/dev/null || echo "")
            [ -z "$ISSUE" ] || gh issue close "$ISSUE" --repo "$GITHUB_REPOSITORY" \
              --comment "PR #${{ github.event.inputs.pr }} 머지로 반영 완료 (자동 종료)" || true
          else
            echo "::warning::자동 머지 실패(충돌/권한?) — PR 열어둠"
          fi

      - name: diff 리포트 업로드 (실패 시)
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Linux baseline PR (수동 갱신 시)
        if: ${{ github.event.inputs.update_baselines == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BR="visual-baselines-${{ github.run_id }}"
          git checkout -b "$BR"
          git add tests
          if git diff --cached --quiet; then
            echo "baseline 변경 없음"
          else
            git commit -m "test(visual): Linux baseline 갱신"
            git push -u origin "$BR"
            gh pr create --base main --head "$BR" --title "test(visual): Linux baseline" \
              --body "CI(Linux) 시각 회귀 baseline. 머지하면 이후 PR 부터 자동 비교 + 증거 코멘트가 동작합니다." || true
          fi
