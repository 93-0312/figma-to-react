name: Consumer smoke

# 라이브러리(bo-ui-kit)가 외부 프로젝트에서 정상 설치·렌더되는지 검증.
# (1) examples/consumer(워크스페이스 링크) — 브라우저에서 토큰 스타일 단언.
# (2) examples/pack-consumer(npm pack tarball 만) — 실제 배포물 그대로 설치·해석 단언.
# → 빌드/exports/CSS/files 경계가 소비자 관점에서 깨지면 PR 에서 잡힌다. (결정적, Claude 미사용)

on:
  pull_request:
    paths:
      - "src/**"
      - "lib/**"
      - "vite.lib.config.ts"
      - "tailwind.lib.config.js"
      - "tailwind.config.js"
      - "scripts/build-lib.mjs"
      - "package.json"
      - "examples/**"
      - ".github/workflows/smoke.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: 라이브러리 빌드 (예시가 import)
        run: npm run build:lib
      - name: 타입 배포 검증 (attw — node16/ESM/CJS 전 모드)
        # d.ts 확장자·dual types 회귀 방지. styles.css 는 CSS 서브패스라 attw 가
        # 해석할 수 없어 제외(타입 검증 대상 아님).
        run: npx --yes @arethetypeswrong/cli@0.18.4 --pack . --exclude-entrypoints ./styles.css
      - name: CJS require 검증 (CommonJS 소비자)
        run: node -e "const ui=require('bo-ui-kit'); const need=['Button','Meter','InputOTP','Field','Input','Checkbox','Label']; const miss=need.filter(k=>!ui[k]); if(miss.length){console.error('CJS export 누락:',miss);process.exit(1)} console.log('✓ CJS require OK —',Object.keys(ui).length,'exports')"
      - name: pack 소비 검증 (tarball 만, 심볼릭 링크 배제)
        run: |
          node scripts/pack-test.mjs
          node examples/pack-consumer/smoke.mjs
      - run: npx playwright install --with-deps chromium
      - name: 소비 앱 띄우고 스모크 단언
        run: |
          npm --prefix examples/consumer run dev > /tmp/consumer-dev.log 2>&1 &
          node examples/consumer/smoke.mjs
      - name: 스모크 스크린샷 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consumer-smoke
          path: examples/consumer/smoke.png
          retention-days: 7
