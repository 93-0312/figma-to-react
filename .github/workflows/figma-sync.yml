name: Figma sync (headless Claude)

# 레벨 2 — 헤드리스 Claude 자동 추출 → 자동 PR.
# 트리거: 수동(workflow_dispatch) + poll 이 노드 지문 게이트 통과 시 `gh workflow run` 으로 호출.
# ⚠️ repository_dispatch(figma-changed)는 구독하지 않는다 — 웹훅은 poll 만 받아 2단 게이트
#    (version + 노드 지문)를 거친 뒤 여기를 트리거한다. 양쪽이 함께 구독하면 저장 1회에
#    sync 가 이중 실행(같은 브랜치명 충돌)되고, autosave 에도 게이트 없이 헤드리스가 기동된다.
#
# 필요한 Secret:
#   - CLAUDE_CODE_OAUTH_TOKEN  : `claude setup-token` 으로 발급(Max/Pro 구독). 헤드리스 Claude 인증.
#   - FIGMA_TOKEN              : Figma PAT (이미 등록됨). 변경 감지/REST 용.
#
# 주의: CI 에서 Figma "추출" 방식(원격 MCP 인증 vs REST)은 첫 실행으로 검증 필요.

on:
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write # claude-code-action 이 OIDC 토큰 교환에 필요
  actions: write # PR 생성 후 Visual regression 을 gh workflow run 으로 트리거(dispatch)하는 데 필요

concurrency:
  group: figma-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install deps (for verify gate)
        run: npm ci

      - name: Headless Claude — Figma sync
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # poll 이 변경 감지 시 봇(github-actions)으로 이 워크플로를 트리거하므로 허용해야 한다.
          # (기본값은 봇 시작 워크플로를 차단 — 루프/악용 방지. 우리 트리거는 node-diff+이슈 dedup 으로 안전.)
          allowed_bots: "github-actions"
          prompt: |
            너는 이 저장소(figma-to-react)의 Figma→React 동기화를 헤드리스로 수행한다.
            반드시 `CLAUDE.md` 규칙(특히 ★ Variant 매핑 규칙)을 지킨다.

            절차:
            1. `figma.manifest.json` 을 읽어 fileKey 와 components[] 를 확보한다.
            2. `npm run check:figma` 실행 (FIGMA_TOKEN 은 env 에 있음).
               - exit 0(최신) → "변경 없음" 으로 종료(아무 변경도 만들지 말 것).
               - exit 10(변경) → 계속. 출력 JSON 의 `currentVersion` 이 **발행(publish)된 버전**이다.
               - ★ IMPORTANT — 이 값을 `PUB` 이라 하고, 이후 **모든 노드/이미지 조회에
                 `&version=<PUB>` 을 붙여 발행 시점 스냅샷을 읽어라.** 디자이너가 발행 후에도
                 계속 편집하므로, 붙이지 않으면 아직 발행되지 않은 작업 중 상태가 섞여 들어온다.
                 (릴리즈 신호는 저장이 아니라 발행이다 — 무명 autosave 는 릴리즈가 아니다.)
            3. **변경분만 타겟 추출**한다 (비용 절감 — 전체 재추출/무거운 페이로드 금지):
               - 먼저 각 컴포넌트의 **가벼운 값만** 읽어 코드 토큰과 비교:
                 REST `GET /v1/files/:key/nodes?ids=<nodeId>&version=<PUB>` 로 **해당 노드만**
                 (무거운 전체 파일 GET 금지, `version` 생략 금지 — 위 2번 참고).
               - **차이가 있는 컴포넌트에만** 깊게 분석·수정한다. 차이 없는 건 절대 건드리지 말 것.
               - 토큰이 바뀌었으면 src/index.css(:root/.dark) + tailwind.config.js 양쪽을 갱신.
               - 큰 페이로드(전체 design_context 등)는 **구조 변경처럼 꼭 필요할 때만** 1회 사용.
               - (Figma MCP 도구가 있으면 fileKey 기반 get_variable_defs 우선 — 더 가벼움.)
               - ★ IMPORTANT — **토큰 값만 비교하지 말 것.** 변경된 노드는 위 nodes 응답의 **실제 fill/스타일
                 바인딩**(어떤 색·어떤 토큰을 참조하는지)을 코드의 해당 클래스(예: 버튼 변형의 `bg-*`)와 대조하라.
                 토큰 *값*이 같아도 컴포넌트가 **참조하는 토큰이 바뀐 경우**(예: 버튼 채움이 A→B 토큰으로 재바인딩)를
                 놓치기 쉽다. 의심되면 `GET /v1/images?ids=<nodeId>` 로 해당 노드를 렌더해 코드 렌더와 눈으로 대조.
               - ★ IMPORTANT — **Figma 에 없는 새 토큰/의미를 발명하지 말 것.** 색이 바뀌면 우선 기존 토큰의 *값*을
                 바꾸거나 기존 토큰으로 **재바인딩**한다. 새 시맨틱 토큰이 정말 필요하면 PR 본문에 그 근거(어떤 Figma
                 변수/스타일에 대응하는지)를 명시하라. (과거 사례: 테스트용 색을 보고 불필요한 `--caution` 토큰을
                 발명 → 롤백 시 바인딩 변경을 못 잡는 원인이 됨.)
            4. `npm run verify` (tsc + vite build) 를 통과시킨다. 실패하면 고치고 재실행. 통과 전엔 커밋 금지.
            5. 변경이 있으면 `figma-sync/<날짜>` 브랜치 생성 → 커밋 → push →
               - IMPORTANT: 같은 날 두 번째 발행이면 그 브랜치가 **이미 원격에 있고 열린 PR 이
                 붙어 있을 수 있다**(검토 대기 중). `git ls-remote --heads origin figma-sync/<날짜>`
                 로 확인해 이미 있으면 `figma-sync/<날짜>-2`, `-3` 처럼 접미사를 붙여 **새 브랜치**를
                 만든다. 남의 검토 대기 PR 에 커밋을 얹지 말 것.
               **반드시 `gh pr create --base main --head <브랜치>` 로 PR 을 생성**한다.
               - IMPORTANT: push 만 하고 끝내지 말 것. PR 생성이 이 작업의 필수 마지막 단계다.
               - IMPORTANT: manifest 갱신은 `lastSyncedVersion`/`lastSyncedAt` **그 두 값만** 문자열 치환으로
                 수정하고, 파일 전체를 재직렬화/재포맷하지 말 것(기존 들여쓰기·인라인 배열 형식 유지).
               - 커밋/PR 본문 끝에 Co-Authored-By 및 생성 표기. main 직접 push 금지.
            6. 변경이 없으면 PR 을 만들지 말고 그대로 종료한다.

            불확실하면 추측해서 커밋하지 말고, 무엇이 막혔는지 로그로 명확히 남겨라.
          claude_args: |
            --max-turns 100
            --allowedTools Bash,Read,Edit,Write,Glob,Grep
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 안전판(결정적): 에이전트가 브랜치만 push 하고 PR 을 안 만들었으면 여기서 생성하고,
      # 열린 sync PR 마다 Visual regression 을 명시적으로 dispatch 한다.
      # (자동화가 GITHUB_TOKEN 으로 연 PR 은 pull_request 이벤트로 워크플로가 트리거되지 않는다 —
      #  단 workflow_dispatch 는 그 재귀 방지의 예외라 GITHUB_TOKEN 으로도 호출된다.)
      - name: Ensure PR exists + trigger visual evidence
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin --prune >/dev/null 2>&1 || true
          for BR in $(git branch -r --format='%(refname:short)' 2>/dev/null | sed 's#^origin/##' | grep '^figma-sync/' || true); do
            AHEAD=$(git rev-list --count "origin/main..origin/$BR" 2>/dev/null || echo 0)
            [ "${AHEAD:-0}" -gt 0 ] || continue
            NUM=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BR" --state open --json number --jq '.[0].number' 2>/dev/null || echo "")
            if [ -z "$NUM" ]; then
              # 좀비 PR 방지(실제 사례 #142): 이 브랜치의 "현재 팁 그대로" 닫힌/머지된 PR 이
              # 있으면 부활시키지 않는다. (예: 머지 후 늦게 도착한 visual 의 baseline push 가
              # 삭제된 브랜치를 재생성 → 다음 sync 의 이 안전판이 stale 내용으로 PR 을 되살려
              # 최신 main 을 역행시키는 사고.) 단, 닫힌 뒤 "새 커밋"이 얹힌 브랜치(같은 날짜
              # 브랜치 재사용 등)는 팁 SHA 가 달라지므로 정상적으로 PR 을 생성한다.
              TIP=$(git rev-parse "origin/$BR" 2>/dev/null || echo "")
              PREV_SHA=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BR" --state closed --json headRefOid --jq '.[0].headRefOid // empty' 2>/dev/null || echo "")
              if [ -n "$TIP" ] && [ "$TIP" = "$PREV_SHA" ]; then
                echo "브랜치 $BR 팁($TIP)이 닫힌/머지된 PR 과 동일 → 부활 생략"
                continue
              fi
              echo "PR 없음 → 생성: $BR (ahead $AHEAD)"
              gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BR" \
                --title "feat(sync): Figma 동기화 (headless Claude)" \
                --body "헤드리스 Claude 자동 동기화 결과입니다. 리뷰 후 머지하세요." || true
              NUM=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BR" --state open --json number --jq '.[0].number' 2>/dev/null || echo "")
            fi
            if [ -n "$NUM" ]; then
              echo "Visual regression dispatch → PR #$NUM"
              gh workflow run "Visual regression" --repo "$GITHUB_REPOSITORY" -f pr="$NUM" || true

              # 변경 감지 이슈를 PR 에 연결(Closes #N) → 머지 시 이슈 자동 종료(셀프 클로즈 불필요)
              ISSUE=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'in:title Figma 변경 감지' --json number --jq '.[0].number // empty' 2>/dev/null || echo "")
              if [ -n "$ISSUE" ]; then
                BODY=$(gh pr view "$NUM" --repo "$GITHUB_REPOSITORY" --json body --jq .body 2>/dev/null || echo "")
                case "$BODY" in
                  *"Closes #$ISSUE"*) echo "이미 연결됨: PR #$NUM ↔ issue #$ISSUE" ;;
                  *) printf '%s\n\nCloses #%s\n' "$BODY" "$ISSUE" \
                       | gh pr edit "$NUM" --repo "$GITHUB_REPOSITORY" --body-file - \
                       && echo "연결: PR #$NUM ↔ issue #$ISSUE (머지 시 자동 종료)" || true ;;
                esac
              fi

              # 에이전트가 PR 본문에 백틱 없는 @멘션을 남겼으면 무력화(외부 알림·머지 히스토리 오염 방지)
              node scripts/sanitize-pr-body.mjs "$NUM" || true
            fi
          done

      # ── no-op 자가 치유: 에이전트가 "코드 반영할 변경 없음"으로 끝난 경우 ──
      # poll 의 노드 지문은 서브트리 전체 해시라 레이어 이름변경/이동 같은 구조 편집에도
      # "변경"으로 뜨지만, 에이전트는 실제 디자인 값을 대조해 no-op 판정할 수 있다.
      # 이때 아무것도 안 하면: 워터마크·지문이 안 전진 → 이슈가 안 닫힘 → poll dedup 이
      # 이후 모든 sync 를 차단하는 교착이 된다(실제 사례: 이슈 #132, 2026-07-09).
      # → 지문·워터마크를 관측 버전으로 전진시키고 이슈를 닫아 사이클을 복구한다.
      # (에이전트 no-op 오판 시 변경이 흡수되는 트레이드오프가 있으나, 이슈 코멘트로
      #  재실행 경로를 안내한다 — 교착으로 전부 막히는 것보다 안전한 방향.)
      - name: No-op 자가 치유 (구조 편집 교착 방지)
        if: success()
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 열린 sync PR 이 있으면 정상 흐름(PR 머지가 이슈를 닫음) → 생략
          OPEN=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --json headRefName \
            --jq '[.[] | select(.headRefName | startswith("figma-sync/"))] | length' 2>/dev/null || echo 1)
          [ "$OPEN" = "0" ] || { echo "열린 sync PR 있음 → 자가 치유 생략"; exit 0; }
          # 버전 게이트가 최신이면 애초에 할 일이 없던 실행 → 생략
          set +e; OUT=$(node scripts/check-figma-version.mjs 2>&1); CODE=$?; set -e
          [ "$CODE" = "10" ] || { echo "버전 최신(또는 오류 $CODE) → 자가 치유 생략"; exit 0; }
          VER=$(printf '%s' "$OUT" | grep -oE '"currentVersion": *"[0-9]+"' | grep -oE '[0-9]+' | head -1)
          echo "에이전트 no-op + 버전 게이트 '변경' → 지문·워터마크 전진 (version=$VER)"
          node scripts/check-figma-nodes.mjs --record ${VER:+--version "$VER"}
          node scripts/check-figma-version.mjs --record "$VER"
          git add figma.fingerprints.json figma.manifest.json
          git diff --cached --quiet && { echo "변화 없음"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(figma): no-op sync — 구조 편집 흡수 (지문·워터마크 전진, 코드 변경 없음)"
          git pull --rebase --autostash origin main >/dev/null 2>&1 || true
          git push origin HEAD:main || { echo "::warning::자가 치유 push 실패(다음 사이클 재시도)"; exit 0; }
          ISSUE=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'in:title Figma 변경 감지' --json number --jq '.[0].number // empty' 2>/dev/null || echo "")
          [ -z "$ISSUE" ] || gh issue close "$ISSUE" --comment "sync 에이전트가 실제 디자인 값을 대조한 결과 **코드에 반영할 변경 없음**(레이어 이름변경/이동 등 구조 편집)으로 판정했습니다. 지문·워터마크만 전진하고 닫습니다. 만약 실제 디자인 변경이 누락된 것이라면 이 이슈를 다시 열고 Actions 에서 \"Figma sync (headless Claude)\" 를 수동 실행하세요." || true

      # 헤드리스 실행이 실패한 경우 알림(가장 흔한 원인: CLAUDE_CODE_OAUTH_TOKEN 만료/크레딧 소진).
      # Figma 토큰은 token-health 가 능동 점검하므로, 여기선 Claude 쪽을 reactive 로 커버한다.
      - name: 헤드리스 실패 알림
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'in:title Figma sync 실패' --json number --jq '.[0].number // empty' 2>/dev/null || echo "")
          [ -z "$OPEN" ] || { echo "이미 열린 실패 이슈 #$OPEN — 생략"; exit 0; }
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh issue create --repo "$GITHUB_REPOSITORY" --title "⚠️ Figma sync 실패 — 점검 필요" \
            --body "$(printf '헤드리스 Figma sync 가 실패했습니다.\n\n실행 로그: %s\n\n**흔한 원인:**\n- **CLAUDE_CODE_OAUTH_TOKEN 만료/무효** (auth 에러면 가장 유력) → 로컬에서 `claude setup-token` 재발급 후 Secret 갱신.\n- 월 헤드리스 크레딧 소진.\n- max-turns 초과 / 일시 오류 → 재실행으로 해결될 수 있음.\n\n로그의 auth/credit 메시지를 확인하세요. 해결 후 이 이슈는 직접 닫으면 됩니다.\n\n— 자동 알림(.github/workflows/figma-sync.yml)' "$RUN_URL")"
