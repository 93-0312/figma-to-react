name: Figma sync (headless Claude)

# 레벨 2 — 헤드리스 Claude 자동 추출 → 자동 PR.
# 트리거: 수동(workflow_dispatch) + repository_dispatch(향후 webhook/외부 트리거용).
#
# 필요한 Secret:
#   - CLAUDE_CODE_OAUTH_TOKEN  : `claude setup-token` 으로 발급(Max/Pro 구독). 헤드리스 Claude 인증.
#   - FIGMA_TOKEN              : Figma PAT (이미 등록됨). 변경 감지/REST 용.
#
# 주의: CI 에서 Figma "추출" 방식(원격 MCP 인증 vs REST)은 첫 실행으로 검증 필요.

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [figma-changed]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write # claude-code-action 이 OIDC 토큰 교환에 필요

concurrency:
  group: figma-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install deps (for verify gate)
        run: npm ci

      - name: Headless Claude — Figma sync
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            너는 이 저장소(figma-to-react)의 Figma→React 동기화를 헤드리스로 수행한다.
            반드시 `CLAUDE.md` 규칙(특히 ★ Variant 매핑 규칙)을 지킨다.

            절차:
            1. `figma.manifest.json` 을 읽어 fileKey 와 components[] 를 확보한다.
            2. `npm run check:figma` 실행 (FIGMA_TOKEN 은 env 에 있음).
               - exit 0(최신) → "변경 없음" 으로 종료(아무 변경도 만들지 말 것).
               - exit 10(변경) → 계속.
            3. **변경분만 타겟 추출**한다 (비용 절감 — 전체 재추출/무거운 페이로드 금지):
               - 먼저 각 컴포넌트의 **가벼운 값만** 읽어 코드 토큰과 비교:
                 REST `GET /v1/files/:key/nodes?ids=<nodeId>` 로 **해당 노드만** (무거운 전체 파일 GET 금지).
               - **차이가 있는 컴포넌트에만** 깊게 분석·수정한다. 차이 없는 건 절대 건드리지 말 것.
               - 토큰이 바뀌었으면 src/index.css(:root/.dark) + tailwind.config.js 양쪽을 갱신.
               - 큰 페이로드(전체 design_context 등)는 **구조 변경처럼 꼭 필요할 때만** 1회 사용.
               - (Figma MCP 도구가 있으면 fileKey 기반 get_variable_defs 우선 — 더 가벼움.)
            4. `npm run verify` (tsc + vite build) 를 통과시킨다. 실패하면 고치고 재실행. 통과 전엔 커밋 금지.
            5. 변경이 있으면 `figma-sync/<날짜>` 브랜치 생성 → 커밋 → push →
               **반드시 `gh pr create --base main --head <브랜치>` 로 PR 을 생성**한다.
               - IMPORTANT: push 만 하고 끝내지 말 것. PR 생성이 이 작업의 필수 마지막 단계다.
               - IMPORTANT: manifest 갱신은 `lastSyncedVersion`/`lastSyncedAt` **그 두 값만** 문자열 치환으로
                 수정하고, 파일 전체를 재직렬화/재포맷하지 말 것(기존 들여쓰기·인라인 배열 형식 유지).
               - 커밋/PR 본문 끝에 Co-Authored-By 및 생성 표기. main 직접 push 금지.
            6. 변경이 없으면 PR 을 만들지 말고 그대로 종료한다.

            불확실하면 추측해서 커밋하지 말고, 무엇이 막혔는지 로그로 명확히 남겨라.
          claude_args: |
            --max-turns 30
            --allowedTools Bash,Read,Edit,Write,Glob,Grep
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 안전판(결정적): 에이전트가 브랜치만 push 하고 PR 을 안 만들었으면 여기서 생성하고,
      # 열린 sync PR 마다 Visual regression 을 명시적으로 dispatch 한다.
      # (자동화가 GITHUB_TOKEN 으로 연 PR 은 pull_request 이벤트로 워크플로가 트리거되지 않는다 —
      #  단 workflow_dispatch 는 그 재귀 방지의 예외라 GITHUB_TOKEN 으로도 호출된다.)
      - name: Ensure PR exists + trigger visual evidence
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin --prune >/dev/null 2>&1 || true
          for BR in $(git branch -r --format='%(refname:short)' 2>/dev/null | sed 's#^origin/##' | grep '^figma-sync/' || true); do
            AHEAD=$(git rev-list --count "origin/main..origin/$BR" 2>/dev/null || echo 0)
            [ "${AHEAD:-0}" -gt 0 ] || continue
            NUM=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BR" --state open --json number --jq '.[0].number' 2>/dev/null || echo "")
            if [ -z "$NUM" ]; then
              echo "PR 없음 → 생성: $BR (ahead $AHEAD)"
              gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BR" \
                --title "feat(sync): Figma 동기화 (headless Claude)" \
                --body "헤드리스 Claude 자동 동기화 결과입니다. 리뷰 후 머지하세요." || true
              NUM=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BR" --state open --json number --jq '.[0].number' 2>/dev/null || echo "")
            fi
            if [ -n "$NUM" ]; then
              echo "Visual regression dispatch → PR #$NUM"
              gh workflow run "Visual regression" --repo "$GITHUB_REPOSITORY" -f pr="$NUM" || true
            fi
          done
