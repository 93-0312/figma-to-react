name: Figma poll

# 발행 감지 → (실제 컴포넌트 변경일 때만) 헤드리스 sync 자동 트리거.
#
# ★ 릴리즈 신호 = Figma **발행(publish)**, 저장이 아니다.
#   디자이너가 라이브러리를 publish 하면 Figma 가 버전에 "Components published" 라벨을
#   붙인다(사람이 직접 이름을 붙여도 동일). 무명 autosave 는 작업 중 상태라 무시한다.
#   → 디자이너는 자유롭게 저장하며 실험하고, publish 를 누른 순간에만 코드에 반영된다.
#
# 2단 게이트:
#   1) 가벼운 /versions 로 **새 발행** 감지(폴링마다, 싸다).
#   2) 발행이 갱신된 경우에만 /nodes 로 **추적 컴포넌트의 실제 내용**을 해시 비교
#      (figma.fingerprints.json). 발행됐어도 추적 컴포넌트가 그대로면(문서/레이아웃만 수정)
#      → 헤드리스 sync 를 돌리지 않고 워터마크만 올려 조용히 넘어간다.
#      ★ 노드 조회는 **발행 시점 스냅샷**(?version=)으로 고정 — 발행 후 디자이너가 계속
#        편집해도 그 작업분이 섞이지 않는다.
#
# 필요: Secret `FIGMA_TOKEN`. scheduled 워크플로는 기본 브랜치(main)에서만 동작.

on:
  schedule:
    # ~15분 간격, 7분 오프셋(정시/15·30·45분 혼잡 회피). 시(hour)는 UTC.
    # UTC 15~18시(=KST 00:00~04:00)는 작업 안 하는 시간이라 폴링 정지 → 그 외 시간만 실행.
    # (즉시 테스트는 수동 dispatch)
    - cron: "7,22,37,52 0-14,19-23 * * *"
  workflow_dispatch: {} # 수동 실행 버튼
  # Figma 웹훅(FILE_UPDATE) → Cloudflare Worker 중계자(relay/) → 이 이벤트로 도착.
  # 푸시 방식이라도 동일한 노드 핑거프린트 게이트를 거쳐 autosave 노이즈를 거른다.
  repository_dispatch:
    types: [figma-changed]

permissions:
  issues: write
  contents: write # no-op(노드 변경 없음) 시 워터마크를 main 에 커밋
  actions: write # 실제 변경 감지 시 Figma sync 워크플로를 gh workflow run 으로 자동 트리거

concurrency:
  group: figma-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 1차 게이트(싸다): 새 **발행** 버전 존재 여부 (무명 autosave 는 무시)
      - name: Check Figma version
        id: check
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
        run: |
          set +e
          OUT=$(node scripts/check-figma-version.mjs 2>&1)
          CODE=$?
          echo "$OUT"
          echo "exitcode=$CODE" >> "$GITHUB_OUTPUT"
          VER=$(printf '%s' "$OUT" | grep -oE '"currentVersion": *"[0-9]+"' | grep -oE '[0-9]+' | head -1)
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      # 2차 게이트(헤비, 새 발행이 있을 때만): 추적 컴포넌트 노드의 실제 변경 여부.
      # ★ 발행 시점 스냅샷으로 고정 조회 — 발행 후의 미발행 작업분을 섞지 않는다.
      - name: Check node-level changes
        id: nodes
        if: steps.check.outputs.exitcode == '10'
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
          VER: ${{ steps.check.outputs.version }}
        run: |
          set +e
          OUT=$(node scripts/check-figma-nodes.mjs ${VER:+--version "$VER"} 2>&1)
          CODE=$?
          echo "$OUT"
          echo "exitcode=$CODE" >> "$GITHUB_OUTPUT"

      # 발행됐지만 추적 컴포넌트는 그대로(문서/레이아웃만 수정) → 워터마크만 전진(헤드리스 미실행)
      - name: Advance watermark (no component change)
        if: steps.check.outputs.exitcode == '10' && steps.nodes.outputs.exitcode == '0'
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # 1차 게이트가 관측한 그 버전으로 고정 기록 — 라이브 재조회로 기록하면 관측~기록
          # 사이에 낀 실제 변경까지 워터마크가 삼켜 다음 폴링이 놓친다(TOCTOU).
          # (version 파싱이 비었으면 종전 라이브 기록으로 폴백)
          node scripts/check-figma-version.mjs --record "${{ steps.check.outputs.version }}"
          if git diff --quiet -- figma.manifest.json; then
            echo "워터마크 변화 없음"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add figma.manifest.json
          git commit -m "chore(figma): 발행 워터마크 전진 (추적 컴포넌트 변경 없음, 추출 생략)"
          git pull --rebase --autostash origin main >/dev/null 2>&1 || true
          git push origin HEAD:main && echo "워터마크 전진 커밋" || echo "::warning::워터마크 push 실패(다음 폴링에서 재시도)"

      # 발행 + 실제 컴포넌트 변경 → 이슈 + 헤드리스 sync 트리거 (발행당 1회, 이슈 dedup)
      - name: Notify + trigger sync (real component change)
        if: steps.check.outputs.exitcode == '10' && steps.nodes.outputs.exitcode == '10'
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.check.outputs.version }}
        run: |
          EXISTING=$(gh issue list --state open --search 'in:title Figma 변경 감지' --json number --jq 'length')
          if [ "$EXISTING" = "0" ]; then
            gh issue create \
              --title "🎨 Figma 변경 감지 — version ${VER}" \
              --body "$(printf '디자이너가 **발행(publish)** 한 버전에서 추적 컴포넌트가 실제로 변경되었습니다 (발행 version: `%s`).\n\n**Figma sync (headless Claude)** 가 자동 실행돼 변경분을 추출하고 PR 을 만듭니다. 그 PR 에 이 이슈가 `Closes #N` 으로 연결됩니다.\n→ **PR 이 머지되면 이 이슈는 자동으로 닫힙니다** (수동 종료 불필요).\n\n> 추출은 발행 시점 스냅샷 기준입니다 — 발행 이후의 미발행 작업분은 다음 발행 때 반영됩니다.\n\n— 자동 감지(.github/workflows/figma-poll.yml)' "${VER}")"
            echo "변경 알림 이슈 생성."
            gh workflow run "Figma sync (headless Claude)" && echo "Figma sync 자동 트리거." || echo "::warning::sync 트리거 실패"
          else
            echo "이미 열린 변경 이슈가 있어 생략 (중복 방지 + sync 재트리거 안 함)."
          fi

      - name: Report error (non-blocking)
        if: steps.check.outputs.exitcode == '2' || steps.nodes.outputs.exitcode == '2'
        run: echo "::warning::Figma 점검 오류(exit 2) — 토큰/레이트리밋 확인 필요. 워터마크 미전진(다음 폴링 재시도)."
