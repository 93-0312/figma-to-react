name: Figma poll

# 무료 플랜용 변경 감지(Phase 1-2). 클라우드에서 주기적으로 Figma version 을 확인하고,
# 변경 시 GitHub Issue 로 알린다. 실제 추출은 알림을 보고 로컬에서 /sync-figma 로 진행.
#
# 필요: 저장소 Secret `FIGMA_TOKEN` (figma PAT, File content: read).
# 주의: scheduled 워크플로는 기본 브랜치(main)에서만 동작한다.

on:
  schedule:
    - cron: "*/5 * * * *" # 5분마다 (테스트용. GitHub 스케줄은 지연 흔함 → 즉시 테스트는 수동 dispatch.
    #                        테스트 끝나면 비용 위해 */30 등으로 되돌리기 권장)
  workflow_dispatch: {} # 수동 실행 버튼

permissions:
  issues: write
  contents: read

concurrency:
  group: figma-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check Figma version
        id: check
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
        run: |
          set +e
          OUT=$(node scripts/check-figma-version.mjs 2>&1)
          CODE=$?
          echo "$OUT"
          echo "exitcode=$CODE" >> "$GITHUB_OUTPUT"
          VER=$(printf '%s' "$OUT" | grep -oE '"currentVersion": *"[0-9]+"' | grep -oE '[0-9]+' | head -1)
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Notify on change (open issue)
        if: steps.check.outputs.exitcode == '10'
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.check.outputs.version }}
        run: |
          EXISTING=$(gh issue list --state open --search 'in:title Figma 변경 감지' --json number --jq 'length')
          if [ "$EXISTING" = "0" ]; then
            gh issue create \
              --title "🎨 Figma 변경 감지 — version ${VER}" \
              --body "$(printf 'Figma 파일이 변경되었습니다 (version: `%s`).\n\n로컬에서 `/sync-figma` 를 실행해 컴포넌트를 동기화하고 PR 을 만드세요.\n동기화가 끝나면 이 이슈를 닫아 주세요.\n\n— 자동 감지(.github/workflows/figma-poll.yml)' "${VER}")"
            echo "변경 알림 이슈 생성."
          else
            echo "이미 열린 변경 이슈가 있어 생략 (중복 방지)."
          fi

      - name: Report error (non-blocking)
        if: steps.check.outputs.exitcode == '2'
        run: echo "::warning::check:figma 오류(exit 2) — 토큰/레이트리밋 확인 필요"
