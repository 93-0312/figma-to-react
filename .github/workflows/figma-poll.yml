name: Figma poll

# 변경 감지 → (실제 컴포넌트 변경일 때만) 헤드리스 sync 자동 트리거.
#
# 2단 게이트:
#   1) 가벼운 /versions 로 파일 version 변화 감지(폴링마다, 싸다).
#   2) version 이 바뀐 경우에만 /nodes 로 **추적 컴포넌트의 실제 내용**을 해시 비교
#      (figma.fingerprints.json). autosave 처럼 무관한 편집은 version 만 올라가고 노드는
#      그대로이므로 → 헤드리스 sync 를 돌리지 않고 워터마크만 올려 조용히 넘어간다.
#      (헛돈 헤드리스 실행 + 좀비 이슈 방지)
#
# 필요: Secret `FIGMA_TOKEN`. scheduled 워크플로는 기본 브랜치(main)에서만 동작.

on:
  schedule:
    - cron: "7,22,37,52 * * * *" # ~15분 간격. 정시/15·30·45분은 혼잡해 지연·누락이 잦아 7분 오프셋 사용 (즉시 테스트는 수동 dispatch)
  workflow_dispatch: {} # 수동 실행 버튼

permissions:
  issues: write
  contents: write # no-op(노드 변경 없음) 시 워터마크를 main 에 커밋
  actions: write # 실제 변경 감지 시 Figma sync 워크플로를 gh workflow run 으로 자동 트리거

concurrency:
  group: figma-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 1차 게이트(싸다): 파일 version 변화
      - name: Check Figma version
        id: check
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
        run: |
          set +e
          OUT=$(node scripts/check-figma-version.mjs 2>&1)
          CODE=$?
          echo "$OUT"
          echo "exitcode=$CODE" >> "$GITHUB_OUTPUT"
          VER=$(printf '%s' "$OUT" | grep -oE '"currentVersion": *"[0-9]+"' | grep -oE '[0-9]+' | head -1)
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      # 2차 게이트(헤비, version 바뀐 경우에만): 추적 컴포넌트 노드의 실제 변경 여부
      - name: Check node-level changes
        id: nodes
        if: steps.check.outputs.exitcode == '10'
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
        run: |
          set +e
          OUT=$(node scripts/check-figma-nodes.mjs 2>&1)
          CODE=$?
          echo "$OUT"
          echo "exitcode=$CODE" >> "$GITHUB_OUTPUT"

      # version 만 올랐고 컴포넌트는 그대로(autosave/무관 편집) → 워터마크만 전진(헤드리스 미실행)
      - name: Advance watermark (no component change)
        if: steps.check.outputs.exitcode == '10' && steps.nodes.outputs.exitcode == '0'
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/check-figma-version.mjs --record
          if git diff --quiet -- figma.manifest.json; then
            echo "워터마크 변화 없음"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add figma.manifest.json
          git commit -m "chore(figma): autosave 워터마크 전진 (컴포넌트 변경 없음, 추출 생략)"
          git pull --rebase --autostash origin main >/dev/null 2>&1 || true
          git push origin HEAD:main && echo "워터마크 전진 커밋" || echo "::warning::워터마크 push 실패(다음 폴링에서 재시도)"

      # 실제 컴포넌트 변경 → 이슈 + 헤드리스 sync 트리거 (변경당 1회, 이슈 dedup)
      - name: Notify + trigger sync (real component change)
        if: steps.check.outputs.exitcode == '10' && steps.nodes.outputs.exitcode == '10'
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.check.outputs.version }}
        run: |
          EXISTING=$(gh issue list --state open --search 'in:title Figma 변경 감지' --json number --jq 'length')
          if [ "$EXISTING" = "0" ]; then
            gh issue create \
              --title "🎨 Figma 변경 감지 — version ${VER}" \
              --body "$(printf '추적 컴포넌트가 실제로 변경되었습니다 (version: `%s`).\n\n**Figma sync (headless Claude)** 가 자동 실행돼 변경분을 추출하고 PR 을 만듭니다. 그 PR 에 이 이슈가 `Closes #N` 으로 연결됩니다.\n→ **PR 이 머지되면 이 이슈는 자동으로 닫힙니다** (수동 종료 불필요).\n\n— 자동 감지(.github/workflows/figma-poll.yml)' "${VER}")"
            echo "변경 알림 이슈 생성."
            gh workflow run "Figma sync (headless Claude)" && echo "Figma sync 자동 트리거." || echo "::warning::sync 트리거 실패"
          else
            echo "이미 열린 변경 이슈가 있어 생략 (중복 방지 + sync 재트리거 안 함)."
          fi

      - name: Report error (non-blocking)
        if: steps.check.outputs.exitcode == '2' || steps.nodes.outputs.exitcode == '2'
        run: echo "::warning::Figma 점검 오류(exit 2) — 토큰/레이트리밋 확인 필요. 워터마크 미전진(다음 폴링 재시도)."
